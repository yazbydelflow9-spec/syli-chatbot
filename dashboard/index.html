<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Syli Study Malaysia — Dashboard</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0f1117;--surface:#1a1d27;--card:#22263a;--border:#2e3352;
  --accent:#4f7cff;--accent2:#00d4a8;--danger:#ff4f6d;--warn:#ffb84f;
  --text:#e8eaf6;--muted:#7a7fa8;--font:'Inter',system-ui,sans-serif;
}
body{background:var(--bg);color:var(--text);font-family:var(--font);height:100vh;display:flex;flex-direction:column;overflow:hidden}

/* HEADER */
header{background:var(--surface);border-bottom:1px solid var(--border);padding:14px 24px;display:flex;align-items:center;gap:16px;flex-shrink:0}
header .logo{font-size:20px;font-weight:700;letter-spacing:-.5px}
header .logo span{color:var(--accent2)}
header .tagline{color:var(--muted);font-size:13px}
header .spacer{flex:1}
.bot-toggle{display:flex;align-items:center;gap:10px;font-size:14px}
.toggle-switch{position:relative;width:44px;height:24px;cursor:pointer}
.toggle-switch input{opacity:0;width:0;height:0}
.toggle-slider{position:absolute;inset:0;background:#444;border-radius:24px;transition:.2s}
.toggle-slider:before{content:'';position:absolute;width:18px;height:18px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.2s}
input:checked + .toggle-slider{background:var(--accent2)}
input:checked + .toggle-slider:before{transform:translateX(20px)}
.status-dot{width:8px;height:8px;border-radius:50%;background:var(--accent2)}
.status-dot.off{background:var(--danger)}

/* LAYOUT */
.layout{display:flex;flex:1;overflow:hidden}

/* SIDEBAR */
.sidebar{width:320px;border-right:1px solid var(--border);display:flex;flex-direction:column;background:var(--surface);flex-shrink:0}
.sidebar-header{padding:16px;border-bottom:1px solid var(--border)}
.search-box{width:100%;background:var(--card);border:1px solid var(--border);color:var(--text);padding:8px 12px;border-radius:8px;font-size:14px;outline:none}
.search-box:focus{border-color:var(--accent)}
.filter-tabs{display:flex;gap:4px;margin-top:10px;flex-wrap:wrap}
.filter-tab{padding:4px 10px;border-radius:20px;font-size:12px;cursor:pointer;border:1px solid var(--border);background:transparent;color:var(--muted);transition:.15s}
.filter-tab.active,.filter-tab:hover{background:var(--accent);color:#fff;border-color:var(--accent)}

/* CLIENT LIST */
.client-list{flex:1;overflow-y:auto}
.client-list::-webkit-scrollbar{width:4px}
.client-list::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}
.client-item{padding:14px 16px;border-bottom:1px solid var(--border);cursor:pointer;transition:.1s;display:flex;flex-direction:column;gap:4px}
.client-item:hover{background:var(--card)}
.client-item.active{background:var(--card);border-left:3px solid var(--accent)}
.client-name{font-weight:600;font-size:14px;display:flex;align-items:center;justify-content:space-between}
.client-preview{color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.client-meta{display:flex;align-items:center;gap:8px;margin-top:2px}
.stage-badge{font-size:10px;padding:2px 7px;border-radius:10px;font-weight:600;text-transform:uppercase;letter-spacing:.4px}
.time-ago{font-size:11px;color:var(--muted)}

/* STAGE COLORS */
.s-lead{background:#2a2a3e;color:#7a7fa8}
.s-interested{background:#1a2f4a;color:#4f9fff}
.s-qualified{background:#1a3a2f;color:#00c49a}
.s-docs_submitted{background:#3a2e1a;color:#ffb84f}
.s-payment_pending{background:#3a1a2a;color:#ff84b0}
.s-visa_pending{background:#2a1a3a;color:#c084ff}
.s-visa_approved{background:#1a3a1a;color:#84ff84}
.s-arrived{background:#1a3a3a;color:#84ffff}

/* STATS BAR */
.stats-bar{padding:12px 16px;border-top:1px solid var(--border);display:flex;gap:16px}
.stat{display:flex;flex-direction:column;gap:2px}
.stat-val{font-size:20px;font-weight:700;color:var(--accent2)}
.stat-label{font-size:11px;color:var(--muted)}

/* MAIN PANEL */
.main{flex:1;display:flex;flex-direction:column;overflow:hidden}
.empty-state{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--muted);gap:12px}
.empty-icon{font-size:48px;opacity:.3}

/* CLIENT DETAIL HEADER */
.detail-header{padding:16px 24px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px;flex-shrink:0;background:var(--surface)}
.client-avatar{width:40px;height:40px;border-radius:50%;background:var(--accent);display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:700;flex-shrink:0}
.client-info{flex:1}
.client-info h2{font-size:16px;font-weight:600}
.client-info p{font-size:12px;color:var(--muted);margin-top:2px}
.header-actions{display:flex;gap:8px;align-items:center}
.btn{padding:7px 14px;border-radius:8px;font-size:13px;cursor:pointer;border:none;font-weight:500;transition:.15s}
.btn-outline{background:transparent;border:1px solid var(--border);color:var(--text)}
.btn-outline:hover{border-color:var(--accent);color:var(--accent)}
.btn-danger{background:var(--danger);color:#fff}
.btn-danger:hover{opacity:.85}
.btn-primary{background:var(--accent);color:#fff}
.btn-primary:hover{opacity:.85}

/* STAGE SELECT */
select.stage-select{background:var(--card);border:1px solid var(--border);color:var(--text);padding:6px 10px;border-radius:8px;font-size:13px;cursor:pointer;outline:none}

/* CONVERSATION */
.conversation{flex:1;overflow-y:auto;padding:20px 24px;display:flex;flex-direction:column;gap:12px}
.conversation::-webkit-scrollbar{width:4px}
.conversation::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}
.msg{max-width:72%;padding:10px 14px;border-radius:12px;font-size:14px;line-height:1.5;word-wrap:break-word}
.msg.user{align-self:flex-end;background:var(--accent);color:#fff;border-bottom-right-radius:4px}
.msg.assistant{align-self:flex-start;background:var(--card);border:1px solid var(--border);border-bottom-left-radius:4px}
.msg-time{font-size:10px;opacity:.6;margin-top:4px}
.day-separator{align-self:center;color:var(--muted);font-size:11px;padding:4px 12px;background:var(--card);border-radius:10px;border:1px solid var(--border)}

/* CLIENT PANEL (right sidebar) */
.client-panel{width:260px;border-left:1px solid var(--border);background:var(--surface);overflow-y:auto;flex-shrink:0}
.client-panel::-webkit-scrollbar{width:4px}
.client-panel::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}
.panel-section{padding:16px;border-bottom:1px solid var(--border)}
.panel-section h3{font-size:11px;text-transform:uppercase;letter-spacing:.8px;color:var(--muted);margin-bottom:12px}
.info-row{display:flex;justify-content:space-between;font-size:13px;margin-bottom:8px;gap:8px}
.info-label{color:var(--muted);flex-shrink:0}
.info-val{text-align:right;word-break:break-all}
.note-box{width:100%;background:var(--card);border:1px solid var(--border);color:var(--text);padding:8px;border-radius:8px;font-size:13px;font-family:inherit;resize:vertical;min-height:80px;outline:none}
.save-note-btn{margin-top:8px;width:100%;background:var(--card);border:1px solid var(--border);color:var(--text);padding:7px;border-radius:8px;cursor:pointer;font-size:13px;transition:.1s}
.save-note-btn:hover{border-color:var(--accent);color:var(--accent)}

/* LOADING */
.loading{display:flex;align-items:center;justify-content:center;height:100px;color:var(--muted);font-size:14px}
.spinner{width:20px;height:20px;border:2px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .6s linear infinite;margin-right:8px}
@keyframes spin{to{transform:rotate(360deg)}}

/* TOAST */
.toast{position:fixed;bottom:24px;right:24px;background:var(--card);border:1px solid var(--border);padding:12px 18px;border-radius:10px;font-size:13px;z-index:1000;animation:slideIn .2s ease}
.toast.success{border-color:var(--accent2);color:var(--accent2)}
.toast.error{border-color:var(--danger);color:var(--danger)}
@keyframes slideIn{from{transform:translateY(20px);opacity:0}to{transform:translateY(0);opacity:1}}

/* STAGE PIPELINE */
.pipeline{display:flex;flex-wrap:wrap;gap:6px}
.pipe-stage{font-size:11px;padding:3px 8px;border-radius:8px;cursor:pointer;border:1px solid transparent;transition:.1s}
.pipe-stage:hover{opacity:.8}
.pipe-stage.current{border-color:var(--text)}

/* RESPONSIVE */
@media(max-width:900px){.client-panel{display:none}}
@media(max-width:600px){.sidebar{width:100%;position:absolute;z-index:10;height:100%}.layout{flex-direction:column}}
</style>
</head>
<body>

<header>
  <div class="logo">Syli <span>Study</span></div>
  <div class="tagline">Dashboard WhatsApp</div>
  <div class="spacer"></div>
  <div class="bot-toggle">
    <span class="status-dot" id="statusDot"></span>
    <span id="statusLabel">Bot actif</span>
    <label class="toggle-switch">
      <input type="checkbox" id="botSwitch" checked onchange="toggleBot(this.checked)"/>
      <span class="toggle-slider"></span>
    </label>
  </div>
</header>

<div class="layout">
  <!-- SIDEBAR -->
  <div class="sidebar">
    <div class="sidebar-header">
      <input class="search-box" type="text" placeholder="Rechercher un client..." id="searchBox" oninput="filterClients()"/>
      <div class="filter-tabs">
        <button class="filter-tab active" onclick="setFilter('all',this)">Tous</button>
        <button class="filter-tab" onclick="setFilter('lead',this)">Lead</button>
        <button class="filter-tab" onclick="setFilter('interested',this)">Intéressé</button>
        <button class="filter-tab" onclick="setFilter('qualified',this)">Qualifié</button>
        <button class="filter-tab" onclick="setFilter('docs_submitted',this)">Docs</button>
        <button class="filter-tab" onclick="setFilter('visa_pending',this)">Visa</button>
        <button class="filter-tab" onclick="setFilter('arrived',this)">Arrivé</button>
      </div>
    </div>
    <div class="client-list" id="clientList">
      <div class="loading"><div class="spinner"></div>Chargement...</div>
    </div>
    <div class="stats-bar" id="statsBar">
      <div class="stat"><span class="stat-val" id="statTotal">—</span><span class="stat-label">Total</span></div>
      <div class="stat"><span class="stat-val" id="statToday">—</span><span class="stat-label">Actifs aujourd'hui</span></div>
    </div>
  </div>

  <!-- MAIN -->
  <div class="main" id="mainPanel">
    <div class="empty-state">
      <div class="empty-icon">💬</div>
      <div>Sélectionnez un client pour voir la conversation</div>
    </div>
  </div>

  <!-- CLIENT PANEL (right) -->
  <div class="client-panel" id="clientPanel" style="display:none">
    <div class="panel-section">
      <h3>Profil</h3>
      <div id="profileInfo"></div>
    </div>
    <div class="panel-section">
      <h3>Étape</h3>
      <div class="pipeline" id="stagePipeline"></div>
    </div>
    <div class="panel-section">
      <h3>Notes</h3>
      <textarea class="note-box" id="noteBox" placeholder="Notes internes..."></textarea>
      <button class="save-note-btn" onclick="saveNote()">Sauvegarder note</button>
    </div>
  </div>
</div>

<script>
const API = '';
const STAGES = ['lead','interested','qualified','docs_submitted','payment_pending','visa_pending','visa_approved','arrived'];
const STAGE_LABELS = {
  lead:'Lead', interested:'Intéressé', qualified:'Qualifié',
  docs_submitted:'Docs soumis', payment_pending:'Paiement', visa_pending:'Visa en cours',
  visa_approved:'Visa approuvé', arrived:'Arrivé'
};

let clients = [];
let filteredClients = [];
let currentClient = null;
let activeFilter = 'all';
let pollInterval = null;

function stageClass(s){ return `s-${s}`; }

function timeAgo(ts){
  if(!ts) return '';
  const diff = Date.now() - new Date(ts).getTime();
  const m = Math.floor(diff/60000);
  if(m < 1) return 'À l\'instant';
  if(m < 60) return `${m}m`;
  const h = Math.floor(m/60);
  if(h < 24) return `${h}h`;
  return `${Math.floor(h/24)}j`;
}

function formatTime(ts){
  if(!ts) return '';
  return new Date(ts).toLocaleString('fr-FR',{hour:'2-digit',minute:'2-digit'});
}

function formatDate(ts){
  if(!ts) return '';
  return new Date(ts).toLocaleDateString('fr-FR',{day:'2-digit',month:'short'});
}

function sameDay(a, b){
  const da = new Date(a), db = new Date(b);
  return da.getFullYear()===db.getFullYear() && da.getMonth()===db.getMonth() && da.getDate()===db.getDate();
}

function toast(msg, type='success'){
  const el = document.createElement('div');
  el.className = `toast ${type}`;
  el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(()=>el.remove(), 3000);
}

async function api(path, method='GET', body=null){
  const opts = {method, headers:{'Content-Type':'application/json'}};
  if(body) opts.body = JSON.stringify(body);
  const r = await fetch(API+path, opts);
  if(!r.ok) throw new Error(await r.text());
  return r.json();
}

async function loadClients(){
  try {
    clients = await api('/api/clients');
    applyFilter();
  } catch(e){ console.error('loadClients:', e); }
}

async function loadStats(){
  try {
    const s = await api('/api/stats');
    document.getElementById('statTotal').textContent = s.total;
    document.getElementById('statToday').textContent = s.active_today;
  } catch(e){}
}

async function loadBotStatus(){
  try {
    const s = await api('/api/bot/status');
    const sw = document.getElementById('botSwitch');
    const dot = document.getElementById('statusDot');
    const lbl = document.getElementById('statusLabel');
    sw.checked = s.is_active;
    dot.className = 'status-dot' + (s.is_active ? '' : ' off');
    lbl.textContent = s.is_active ? 'Bot actif' : 'Bot en pause';
  } catch(e){}
}

async function toggleBot(active){
  try {
    await api('/api/bot/toggle','POST',{is_active:active});
    const dot = document.getElementById('statusDot');
    const lbl = document.getElementById('statusLabel');
    dot.className = 'status-dot' + (active ? '' : ' off');
    lbl.textContent = active ? 'Bot actif' : 'Bot en pause';
    toast(active ? 'Bot activé' : 'Bot mis en pause');
  } catch(e){ toast('Erreur','error'); }
}

function setFilter(f, btn){
  activeFilter = f;
  document.querySelectorAll('.filter-tab').forEach(t=>t.classList.remove('active'));
  btn.classList.add('active');
  applyFilter();
}

function filterClients(){
  applyFilter();
}

function applyFilter(){
  const q = document.getElementById('searchBox').value.toLowerCase();
  filteredClients = clients.filter(c=>{
    if(activeFilter !== 'all' && c.stage !== activeFilter) return false;
    if(q){
      const searchable = `${c.name||''} ${c.phone||''} ${c.desired_programme||''}`.toLowerCase();
      if(!searchable.includes(q)) return false;
    }
    return true;
  });
  renderClientList();
}

function renderClientList(){
  const el = document.getElementById('clientList');
  if(!filteredClients.length){
    el.innerHTML = '<div style="padding:24px;text-align:center;color:var(--muted);font-size:13px">Aucun client</div>';
    return;
  }
  el.innerHTML = filteredClients.map(c=>{
    const active = currentClient && currentClient.id === c.id;
    const initials = (c.name||c.phone||'?').slice(0,2).toUpperCase();
    return `<div class="client-item${active?' active':''}" onclick="selectClient('${c.id}')">
      <div class="client-name">
        <span>${c.name || c.phone}</span>
        <span class="time-ago">${timeAgo(c.last_contact)}</span>
      </div>
      <div class="client-meta">
        <span class="stage-badge ${stageClass(c.stage)}">${STAGE_LABELS[c.stage]||c.stage}</span>
        ${c.desired_programme ? `<span style="font-size:11px;color:var(--muted)">${c.desired_programme}</span>` : ''}
        ${c.is_bot_paused ? '<span style="font-size:10px;color:var(--warn)">⏸ Pausé</span>' : ''}
        ${c.guide_sent ? '<span style="font-size:10px;color:var(--accent2)">📄</span>' : ''}
      </div>
      <div class="client-preview">${c.phone}</div>
    </div>`;
  }).join('');
}

async function selectClient(id){
  currentClient = clients.find(c=>c.id===id);
  if(!currentClient) return;

  // Highlight in list
  renderClientList();

  // Show right panel
  document.getElementById('clientPanel').style.display = 'flex';
  document.getElementById('clientPanel').style.flexDirection = 'column';

  renderClientPanel();
  await loadConversation(id);

  // Auto-refresh conversation every 10s
  clearInterval(pollInterval);
  pollInterval = setInterval(()=>loadConversation(id), 10000);
}

function renderClientPanel(){
  const c = currentClient;
  document.getElementById('profileInfo').innerHTML = `
    <div class="info-row"><span class="info-label">Téléphone</span><span class="info-val">${c.phone}</span></div>
    <div class="info-row"><span class="info-label">Nom</span><span class="info-val">${c.name||'—'}</span></div>
    <div class="info-row"><span class="info-label">Programme</span><span class="info-val">${c.desired_programme||'—'}</span></div>
    <div class="info-row"><span class="info-label">Bac</span><span class="info-val">${c.bac_level||'—'}</span></div>
    <div class="info-row"><span class="info-label">Guide envoyé</span><span class="info-val">${c.guide_sent?'✅':'❌'}</span></div>
    <div class="info-row"><span class="info-label">Bot pausé</span><span class="info-val">
      <input type="checkbox" ${c.is_bot_paused?'checked':''} onchange="togglePause(this.checked)"/>
    </span></div>
    <div class="info-row"><span class="info-label">Client depuis</span><span class="info-val">${formatDate(c.created_at)}</span></div>
  `;

  document.getElementById('stagePipeline').innerHTML = STAGES.map(s=>`
    <span class="pipe-stage ${stageClass(s)} ${c.stage===s?'current':''}" onclick="changeStage('${s}')">${STAGE_LABELS[s]}</span>
  `).join('');

  document.getElementById('noteBox').value = c.notes || '';
}

async function loadConversation(clientId){
  const main = document.getElementById('mainPanel');
  const c = currentClient;

  let messages;
  try {
    messages = await api(`/api/clients/${clientId}/messages`);
  } catch(e){ return; }

  const initials = (c.name||c.phone||'?').slice(0,2).toUpperCase();

  let convHtml = `
    <div class="detail-header">
      <div class="client-avatar">${initials}</div>
      <div class="client-info">
        <h2>${c.name || c.phone}</h2>
        <p>${c.phone} · ${STAGE_LABELS[c.stage]||c.stage}</p>
      </div>
      <div class="header-actions">
        <select class="stage-select" onchange="changeStage(this.value)">
          ${STAGES.map(s=>`<option value="${s}" ${c.stage===s?'selected':''}>${STAGE_LABELS[s]}</option>`).join('')}
        </select>
        <button class="btn btn-outline" onclick="archiveClient()">Archiver</button>
      </div>
    </div>
    <div class="conversation" id="convMessages">
  `;

  if(!messages.length){
    convHtml += '<div style="align-self:center;color:var(--muted);font-size:13px;margin-top:40px">Aucun message encore</div>';
  } else {
    let lastDate = null;
    messages.forEach(msg=>{
      const msgDate = msg.created_at ? msg.created_at.slice(0,10) : '';
      if(msgDate && msgDate !== lastDate){
        convHtml += `<div class="day-separator">${formatDate(msg.created_at)}</div>`;
        lastDate = msgDate;
      }
      convHtml += `<div class="msg ${msg.role}">
        ${msg.content.replace(/\n/g,'<br/>')}
        <div class="msg-time">${formatTime(msg.created_at)}</div>
      </div>`;
    });
  }

  convHtml += '</div>';
  main.innerHTML = convHtml;

  // Scroll to bottom
  const conv = document.getElementById('convMessages');
  if(conv) conv.scrollTop = conv.scrollHeight;
}

async function changeStage(newStage){
  if(!currentClient) return;
  try {
    const updated = await api(`/api/clients/${currentClient.id}`,'PATCH',{stage:newStage});
    currentClient.stage = newStage;
    const idx = clients.findIndex(c=>c.id===currentClient.id);
    if(idx>=0) clients[idx].stage = newStage;
    renderClientList();
    renderClientPanel();
    toast(`Étape → ${STAGE_LABELS[newStage]}`);
  } catch(e){ toast('Erreur changement étape','error'); }
}

async function togglePause(paused){
  if(!currentClient) return;
  try {
    await api(`/api/clients/${currentClient.id}`,'PATCH',{is_bot_paused:paused});
    currentClient.is_bot_paused = paused;
    const idx = clients.findIndex(c=>c.id===currentClient.id);
    if(idx>=0) clients[idx].is_bot_paused = paused;
    toast(paused ? 'Bot pausé pour ce client' : 'Bot réactivé');
  } catch(e){ toast('Erreur','error'); }
}

async function archiveClient(){
  if(!currentClient || !confirm('Archiver ce client ?')) return;
  try {
    await api(`/api/clients/${currentClient.id}`,'PATCH',{is_archived:true});
    clients = clients.filter(c=>c.id!==currentClient.id);
    currentClient = null;
    clearInterval(pollInterval);
    applyFilter();
    document.getElementById('clientPanel').style.display = 'none';
    document.getElementById('mainPanel').innerHTML = `
      <div class="empty-state">
        <div class="empty-icon">💬</div>
        <div>Sélectionnez un client pour voir la conversation</div>
      </div>`;
    toast('Client archivé');
  } catch(e){ toast('Erreur archivage','error'); }
}

async function saveNote(){
  if(!currentClient) return;
  const notes = document.getElementById('noteBox').value;
  try {
    await api(`/api/clients/${currentClient.id}`,'PATCH',{notes});
    currentClient.notes = notes;
    toast('Note sauvegardée');
  } catch(e){ toast('Erreur','error'); }
}

// INIT
async function init(){
  await Promise.all([loadClients(), loadStats(), loadBotStatus()]);
  // Refresh clients every 30s
  setInterval(()=>{ loadClients(); loadStats(); }, 30000);
}

init();
</script>
</body>
</html>
